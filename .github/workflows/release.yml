name: 'Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to be released.'
        required: true
        type: string
      base-branch:
        description: 'The branch where we do this release.'
        required: false
        default: 'main'
        type: string

permissions: {}

env:
  BUNDLE_WITH: release

jobs:
  release:
    name: 'Release'
    environment: release
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'overlookinfra'
    steps:
      - name: Validate version format
        run: |
          # Module versions look like 1.2.3
          if ! echo "${{ inputs.version }}" | grep -qE '^[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$'; then
            echo "::error::Version '${{ inputs.version }}' does not match expected format (semver like 1.2.3)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_PAT }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Setup git and SSH signing
        id: git_identity
        uses: ./.github/actions/setup-git-ssh-signing
        with:
          ssh_private_key: ${{ secrets.RELEASE_SSH_PRIVATE_KEY }}
          git_author_name: ${{ vars.RELEASE_GIT_NAME }}
          git_author_email: ${{ vars.RELEASE_GIT_EMAIL }}
          git_committer_name: ${{ vars.RELEASE_GIT_NAME }}
          git_committer_email: ${{ vars.RELEASE_GIT_EMAIL }}

      - name: Check tag doesn't already exist
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag '${{ inputs.version }}' already exists!"
            exit 1
          fi

      - name: Check metadata.json carries the version
        run: |
          if ! grep -q '"version": "${{ inputs.version }}"' metadata.json; then
            echo "::error::metadata.json does not carry version ${{ inputs.version }}. Merge the release PR first."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        id: extract_notes
        run: |
          ruby << 'EOF'
          version = "${{ inputs.version }}"

          unless File.exist?('CHANGELOG.md')
            warn "::warning::No CHANGELOG.md found, release will use auto-generated notes only"
            File.write(ENV['GITHUB_OUTPUT'], "has_notes=false\n", mode: 'a')
            exit 0
          end

          changelog = File.read('CHANGELOG.md')

          # Match ## [VERSION]...\n then capture everything until the next ## [ or end of file
          match = changelog.match(/^## \[#{Regexp.escape(version)}\][^\n]*\n(?<notes>.+?)(?=^## \[|\z)/m)

          unless match
            warn "::warning::Could not find version #{version} in CHANGELOG.md, release will use auto-generated notes only"
            File.write(ENV['GITHUB_OUTPUT'], "has_notes=false\n", mode: 'a')
            exit 0
          end

          notes = match[:notes].strip

          if notes.empty?
            warn "::warning::Version #{version} section is empty, release will use auto-generated notes only"
            File.write(ENV['GITHUB_OUTPUT'], "has_notes=false\n", mode: 'a')
            exit 0
          end

          File.write('release_notes.md', notes)
          File.write(ENV['GITHUB_OUTPUT'], "has_notes=true\n", mode: 'a')
          puts "Extracted release notes for version #{version}"
          EOF

      - name: Create signed tag
        run: |
          git tag -s -m "Release ${{ inputs.version }}" "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Build and push the module to the Puppet Forge
        env:
          BLACKSMITH_FORGE_API_KEY: ${{ secrets.PUPPET_FORGE_API_KEY }}
        run: bundle exec rake module:push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_PAT }}
        run: |
          RELEASE_ARGS=(
            "${{ inputs.version }}"
            --title "${{ inputs.version }}"
            --generate-notes
            --verify-tag
            --latest
          )

          if [ "${{ steps.extract_notes.outputs.has_notes }}" = "true" ]; then
            RELEASE_ARGS+=(--notes-file release_notes.md)
          fi

          gh release create "${RELEASE_ARGS[@]}" pkg/*.tar.gz
