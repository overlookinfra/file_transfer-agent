name: 'Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to be released.'
        required: true
        type: string
      base-branch:
        description: 'The branch where we do this release.'
        required: false
        default: 'main'
        type: string

permissions: {}

env:
  BUNDLE_WITH: release

jobs:
  release:
    name: 'Release'
    environment: release
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'overlookinfra'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_PAT }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Setup git and SSH signing
        id: git_identity
        uses: ./.github/actions/setup-git-ssh-signing
        with:
          ssh_private_key: ${{ secrets.RELEASE_SSH_PRIVATE_KEY }}
          git_author_name: ${{ vars.RELEASE_GIT_NAME }}
          git_author_email: ${{ vars.RELEASE_GIT_EMAIL }}
          git_committer_name: ${{ vars.RELEASE_GIT_NAME }}
          git_committer_email: ${{ vars.RELEASE_GIT_EMAIL }}

      - name: Check metadata.json contains the version
        env:
          VERSION: ${{ inputs.version }}
        run: bundle exec rake "release:check[$VERSION]"

      - name: Create signed tag
        run: bundle exec rake release:tag

      - name: Build and push the module to the Puppet Forge
        env:
          BLACKSMITH_FORGE_API_KEY: ${{ secrets.PUPPET_FORGE_API_KEY }}
        run: bundle exec rake module:push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_PAT }}
        run: bundle exec rake release:github
